# Builds the package with uv and uploads it to PyPI.
#
# Triggered either by release.yml (which creates the GitHub Release from a pushed
# tag and then calls this workflow), or directly by a Release published by hand.
#
# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Upload Python Package

on:
  release:
    types: [published]

  workflow_call:
    inputs:
      ref:
        description: 'Git ref to build from; defaults to the triggering ref when empty'
        required: false
        type: string

permissions:
  contents: read

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ inputs.ref }}

    - name: Install uv
      uses: astral-sh/setup-uv@v8.1.0
      with:
        version: "latest"

    - name: Build package
      run: uv build

    - name: Publish package
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
