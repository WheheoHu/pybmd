name: dash-build
on:
  workflow_run:
    workflows: ["sphinx-build"]
    types:
      - completed

  workflow_dispatch:

jobs:
  doc2dash:
    runs-on: macos-latest
    # Only run after a successful sphinx-build, or on manual dispatch.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: install doc2dash
        run: |
          brew install hynek/tap/doc2dash
          #brew install tree

      - name: Download docs HTML from sphinx-build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID="${{ github.event.workflow_run.id }}"
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list --workflow sphinx-build --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          gh run download "$RUN_ID" -n docs-html -D ./docs-html

      - name: doc2dash generate dash docset.
        run: |
          #tree
          doc2dash ./docs-html -n pybmd -i ./docs/dash_docset_icon/icon@2x.png -f

      - name: upload dash doc as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dash_docset
          path: ./pybmd.docset
